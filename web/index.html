<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机械加工质量管理系统 · E-QTSF</title>
  <link rel="stylesheet" href="/vendor/index.css">
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/index.full.min.js"></script>
  <script src="/vendor/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; }
    #app { min-height: 100vh; }
    .login-box { width: 380px; margin: 12vh auto; background: #fff; padding: 36px;
                 border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .login-title { text-align: center; font-size: 20px; font-weight: 700;
                   margin-bottom: 6px; color: #1f2d3d; }
    .login-sub { text-align: center; color: #909399; font-size: 12px; margin-bottom: 24px; }
    .layout { display: flex; min-height: 100vh; }
    .side { width: 220px; background: #1f2d3d; color: #cfd8e3; padding-top: 12px; flex-shrink: 0; }
    .logo { text-align: center; padding: 14px 0 18px; font-weight: 700; color: #fff;
            letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .logo small { display: block; font-weight: 400; color: #7f8fa4; font-size: 11px; }
    .menu-item { padding: 12px 22px; cursor: pointer; font-size: 14px; display: flex; gap: 8px;
                 align-items: center; border-left: 3px solid transparent; }
    .menu-item:hover { background: rgba(255,255,255,.06); }
    .menu-item.active { background: #2b3d52; border-left-color: #409eff; color: #fff; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 54px; background: #fff; display: flex; align-items: center;
              justify-content: space-between; padding: 0 24px;
              box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .content { padding: 18px 24px; flex: 1; overflow: auto; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .card .v { font-size: 26px; font-weight: 700; color: #1f2d3d; }
    .card .t { color: #909399; font-size: 12px; margin-top: 4px; }
    .panel { background: #fff; border-radius: 8px; padding: 16px;
             box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 15px; color: #303133; }
    .chart { width: 100%; height: 320px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .pager { margin-top: 12px; text-align: right; }
    .alert-red { color: #f56c6c; font-weight: 700; }
    .alert-orange { color: #e6a23c; font-weight: 700; }
    .alert-yellow { color: #f3a712; font-weight: 700; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="/static/app.js"></script>
</body>
</html>
